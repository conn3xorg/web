<head>

<title>Choosing your first stack: social card</title>
<link rel="stylesheet" href="../why-conn3x/shared.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; color: var(--text); font-variant-ligatures: none; }
  .frame { padding: 60px 72px; height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 30px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 44px; }
  .label { font-family: var(--mono); font-size: 20px; letter-spacing: 0.14em; color: var(--muted); }
  .label b { color: var(--accent); font-weight: 600; }
  h1 { font-size: 66px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; }
  h1 span { color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: stretch; align-self: end; }
  .arrow { align-self: center; }
  pre { font-family: var(--mono); font-size: 21px; line-height: 1.5; background: var(--ink-3); border: 2px solid var(--line); padding: 20px 24px; margin: 0; white-space: pre; }
  .tag { display: block; font-size: 15px; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 8px; }
  .arrow { text-align: center; color: var(--accent); font-size: 40px; font-family: var(--mono); }
  .k { color: var(--accent); } .s { color: var(--add); }
</style>
</head>
<body class="grid-dark">
<div class="frame">
  <div class="top"><img src="../../../apps/site/src/brand/logo-dark.svg" alt=""><span class="label"><b>YOUR FIRST STACK</b> · 3 OF 3</span></div>
  <h1>Learn one loop.<br><span>Not two tools.</span></h1>
  <div class="row">
<pre><span class="tag">YOUR FIRST FIVE MINUTES</span>$ ./up.sh
$ conn3x plan
$ conn3x apply
$ conn3x plan</pre>
    <div class="arrow">→</div>
<pre><span class="tag">WHAT YOU SEE</span><span class="s">Plan: 3 to add</span>
<span class="s">Apply complete!</span>
<span class="s">No changes.</span></pre>
  </div>
</div>
</body>
