<html lang="en">
<head>
<meta charset="utf-8">
<title>Conn3x v0.6.2: social card</title>
<link rel="stylesheet" href="../why-conn3x/shared.css">
<style>
  body { width: 1200px; height: 675px; overflow: hidden; color: var(--text); font-variant-ligatures: none; }
  .frame { padding: 64px 72px; height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 36px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 44px; }
  .label { font-family: var(--mono); font-size: 20px; letter-spacing: 0.14em; color: var(--muted); }
  .label b { color: var(--accent); font-weight: 600; }
  h1 { font-size: 72px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; }
  h1 span { color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-self: end; }
  pre { font-family: var(--mono); font-size: 19px; line-height: 1.55; background: var(--ink-3); border: 2px solid var(--line); padding: 24px 28px; margin: 0; white-space: pre; }
  .k { color: var(--accent); } .s { color: var(--add); } .c { color: var(--dim); }
  .tag { display: block; font-size: 15px; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 10px; }
</style>
</head>
<body class="grid-dark">
<div class="frame">
  <div class="top"><img src="../../../apps/site/src/brand/logo-dark.svg" alt=""><span class="label"><b>V0.6.2</b> · OUT NOW</span></div>
  <h1>Ten steps at once?<br><span>No more "open failed".</span></h1>
  <div class="row">
<pre><span class="tag">BEFORE</span>Error: opening session:
  ssh: rejected: connect failed
  ("open failed")</pre>
<pre><span class="tag">V0.6.2</span><span class="s">+</span> sessions queue, 8 at a time
<span class="s">+</span> fewer when the server says so
<span class="s">+</span> unreadable files are errors
<span class="s">+</span> clearer step errors</pre>
  </div>
</div>
</body>
</html>
