name: Contributors

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# A manual run and the schedule at once could each find no issue and open one.
concurrency:
  group: contributors

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Logins are checked in contributors.js, and the issue's other text is fixed.
      - name: Open or update the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/site/src/lib/contributors.js --issue
