name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: |
            apps/site/dist
            apps/docs/dist
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: bash scripts/dco-check_test.sh
      - run: pnpm build
      - name: Browser tests
        working-directory: apps/site
        run: |
          # --with-deps installs Chromium's libraries with apt. When the
          # runner can't reach Ubuntu's mirrors, the image's own libraries
          # are enough, and a missing one still fails the tests below.
          pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
          pnpm exec playwright test

  # Every page has to show its largest content in under 2 seconds on
  # Lighthouse's mobile run (James, 16 Nov 2026). scripts/speed.mjs lists the
  # pages and fails over budget.
  speed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check each site as Cloudflare would serve it
        run: |
          # One wrangler dev at a time: two can't share their local socket.
          check() {
            (cd "apps/$1" && pnpm exec wrangler dev --port 8787 --ip 127.0.0.1 > "/tmp/$1.log" 2>&1 & echo $! > "/tmp/$1.pid")
            if ! timeout 180 bash -c "until curl -s -o /dev/null http://127.0.0.1:8787/; do sleep 1; done"; then
              echo "::error::wrangler dev for $1 never answered"
              tail -n 40 "/tmp/$1.log"
              return 1
            fi
            node scripts/speed.mjs "$1" http://127.0.0.1:8787
            local rc=$?
            pkill -f "wrangler dev --port 8787" || true
            sleep 2
            return $rc
          }
          rc=0
          check site || rc=1
          check docs || rc=1
          exit $rc

  # Every config the Circuit Builder can write for the CI builds, made by the
  # same code as the page, has to pass conn3x validate, which also checks the
  # values against each circuit's own rules.
  builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Conn3x
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      # Builds that create servers read the public key while validating.
      - run: mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
      - run: node scripts/builder-combos.mjs "$RUNNER_TEMP/builds"
      - name: Validate every build
        working-directory: ${{ runner.temp }}/builds
        # Every build needs the same few providers. One cache means each is
        # fetched once, not once a build, so a release host having a bad
        # minute fails one download instead of dozens; a failed init gets
        # one more try for the same reason.
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          conn3x fmt -check -recursive .
          failed=""
          for d in */; do
            echo "::group::${d%/}"
            (cd "$d" && { conn3x init -backend=false -no-color > /dev/null || { sleep 20; conn3x init -backend=false -no-color > /dev/null; }; } && conn3x validate -no-color) || failed="$failed ${d%/}"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::These builds don't validate:$failed"
            exit 1
          fi

  lighthouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse (mobile)
        working-directory: apps/site
        run: pnpm exec lhci autorun --config=lighthouserc.mobile.json
      - name: Lighthouse (desktop)
        working-directory: apps/site
        run: pnpm exec lhci autorun --config=lighthouserc.json
